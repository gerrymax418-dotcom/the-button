<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nothing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #screen {
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: background-color 0.15s;
        }
    </style>
</head>

<body>

<div id="screen"></div>

<script>
    // ==============================
    // PUT YOUR SUPABASE DETAILS HERE
    // ==============================

    const SUPABASE_URL = "https://ijttejathgvqqcfmihlb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NVSkl_vRvmFSmpNv-bmB6A_LfyPt1fE";

    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const screen = document.getElementById("screen");

    // Change the actual screen colour
    function setColour(colour) {
        if (colour === "dark") {
            screen.style.backgroundColor = "#050a19";
        } else {
            screen.style.backgroundColor = "#f5f0e6";
        }
    }

    // Get the current colour when the page loads
    async function loadColour() {
        const { data, error } = await supabase
            .from("screen")
            .select("colour")
            .eq("id", 1)
            .single();

        if (error) {
            console.error(error);
            return;
        }

        setColour(data.colour);
    }

    // When someone clicks, switch the global colour
    screen.onclick = async function() {

        const { data, error } = await supabase
            .from("screen")
            .select("colour")
            .eq("id", 1)
            .single();

        if (error) {
            console.error(error);
            return;
        }

        const newColour =
            data.colour === "dark" ? "light" : "dark";

        await supabase
            .from("screen")
            .update({ colour: newColour })
            .eq("id", 1);
    };

    // Listen for changes made by ANYONE
    supabase
        .channel("screen-changes")
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "screen",
                filter: "id=eq.1"
            },
            payload => {
                setColour(payload.new.colour);
            }
        )
        .subscribe();

    loadColour();
</script>

</body>
</html>
