<!DOCTYPE html>
<html>
<head>
    <title>Nothing</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #screen {
            width: 100%;
            height: 100%;
            background: #f5f0e6;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="screen"></div>

<script>
    const screen = document.getElementById("screen");

    screen.onclick = function() {
        if (screen.style.background === "rgb(5, 10, 25)") {
            screen.style.background = "#f5f0e6";
        } else {
            screen.style.background = "#050a19";
        }
    };
</script>

</body>
</html>
